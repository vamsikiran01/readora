{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password | Readora LMS{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-6">
        
        <div class="text-center">
            <div class="w-12 h-12 rounded-2xl bg-brand-600 text-white flex items-center justify-center text-xl mx-auto shadow-md shadow-brand-500/20 mb-4">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 class="text-3xl font-display font-bold text-slate-900 tracking-tight">Password Recovery</h2>
            <p class="mt-2 text-sm text-slate-500">Enter your university email address and we'll generate password reset instructions.</p>
        </div>

        <div class="bg-white p-8 rounded-2xl border border-slate-200/80 shadow-lg shadow-slate-200/50">
            <form method="POST" action="{% url 'forgot_password' %}" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-700 mb-1">Registered University Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                        <input type="email" id="email" name="email" required placeholder="e.g. vamsi@university.edu"
                               class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
                    </div>
                </div>

                <button type="submit" class="w-full py-3 px-4 rounded-xl text-white bg-brand-600 hover:bg-brand-700 font-semibold text-sm shadow-md shadow-brand-500/20 hover:shadow-lg transition-all duration-200">
                    Send Password Reset Link
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center">
                <a href="{% url 'login' %}" class="text-xs font-semibold text-brand-600 hover:text-brand-700 flex items-center justify-center gap-1">
                    <i class="fa-solid fa-arrow-left text-[10px]"></i> Back to Sign In
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
